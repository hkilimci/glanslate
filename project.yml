name: Glanslate
options:
  minimumXcodeGenVersion: 2.44.1
  xcodeVersion: "16.0"
packages:
  GlanslateKit:
    path: Packages/GlanslateKit
configs:
  Debug: debug
  Release: release
targets:
  Glanslate:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Configs/Base.xcconfig
      Release: Configs/Base.xcconfig
    sources:
      - path: App
        excludes:
          - Info.plist
          - Glanslate.entitlements
    settings:
      base:
        PRODUCT_NAME: Glanslate
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Glanslate.entitlements
        ENABLE_APP_SANDBOX: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: GlanslateKit
        product: GlanslateKit
schemes:
  Glanslate:
    build:
      targets:
        Glanslate: all
