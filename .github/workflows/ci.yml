name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test GlanslateCore
        run: swift test --package-path Packages/GlanslateKit

  macos:
    name: Build and test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      snapshot-outcome: ${{ steps.snapshots.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build package
        run: |
          if ! swift build --build-tests --package-path Packages/GlanslateKit > package-build.log 2>&1; then
            echo "::group::Full build log"; cat package-build.log; echo "::endgroup::"
            echo "Error summary:"; grep -E "error:" package-build.log | sort -u | head -120
            exit 1
          fi
      - name: Test package
        run: swift test --skip-build --package-path Packages/GlanslateKit 2>&1 | tail -60
      - name: Render interface snapshots
        id: snapshots
        timeout-minutes: 6
        continue-on-error: true
        run: |
          mkdir -p snapshots
          GLANSLATE_SNAPSHOTS="$PWD/snapshots" swift test --skip-build --package-path Packages/GlanslateKit \
            --filter InterfaceSnapshotTests 2>&1 | tail -20
          ls snapshots | head -80
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-snapshots
          path: snapshots
          retention-days: 14
      - name: Build app
        if: hashFiles('Glanslate.xcodeproj/project.pbxproj') != ''
        run: |
          if ! xcodebuild -project Glanslate.xcodeproj -scheme Glanslate -configuration Debug \
              -destination 'platform=macOS' -derivedDataPath build \
              CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build > app-build.log 2>&1; then
            echo "::group::Full build log"; cat app-build.log; echo "::endgroup::"
            echo "Error summary:"; grep -E "error:|\*\* BUILD FAILED" app-build.log | sort -u | head -120
            exit 1
          fi
          grep -E "warning:" app-build.log | sort -u | head -60 || true
      - name: Test scheme
        if: hashFiles('Glanslate.xcodeproj/project.pbxproj') != ''
        run: |
          if ! xcodebuild -project Glanslate.xcodeproj -scheme Glanslate -configuration Debug \
              -destination 'platform=macOS' -derivedDataPath build \
              CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test > app-test.log 2>&1; then
            echo "::group::Full test log"; cat app-test.log; echo "::endgroup::"
            echo "Error summary:"; grep -E "error:|failed|\*\* TEST FAILED" app-test.log | sort -u | head -80
            exit 1
          fi
          grep -E "Test run with|Executed" app-test.log | tail -5

  commit-snapshots:
    name: Commit interface snapshots
    needs: [core-linux, macos]
    # Only trusted pushes can receive a write token. Pull-request code is built
    # and tested in the read-only jobs above, never in this job.
    if: >-
      github.event_name == 'push'
      && contains(github.event.head_commit.message, '[snapshots]')
      && needs.macos.outputs.snapshot-outcome == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download snapshots from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: interface-snapshots
          path: snapshots
      - name: Commit snapshots
        run: |
          shopt -s nullglob
          rendered=(snapshots/*.png)
          if (( ${#rendered[@]} == 0 )); then
            echo "No snapshots were rendered; keeping Docs/Screenshots."
            exit 0
          fi
          rm -rf Docs/Screenshots && mkdir -p Docs/Screenshots
          cp "${rendered[@]}" Docs/Screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Update interface snapshots [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
